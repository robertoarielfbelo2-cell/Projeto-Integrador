<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrativo - Vox Populis</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Vox Populis</h1>
        <h2>Área Administrativa</h2>
    </header>

    <main>

        <h3>Login do Administrador</h3>

        <form id="formLoginAdmin">

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="senha">Senha:</label>
            <input
                type="password"
                id="senha"
                name="senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <p id="mensagem" role="status"></p>

        <a href="index.html">Voltar para o início</a>

    </main>

    <script src="../js/scriptLoginAdmin.js"></script>

</body>
</html>
