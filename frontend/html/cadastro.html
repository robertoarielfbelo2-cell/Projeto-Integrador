<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cidadão | Vox Populis</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Vox Populis</h1>
        <p>Plataforma de participação cidadã</p>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="vereadores.html">Vereadores</a>
        </nav>

        <div class="conta">
            <a href="login.html">Entrar</a>
            <a href="cadastro.html" aria-current="page">Cadastrar-se</a>
        </div>
    </header>

    <main>
        <section aria-labelledby="tituloCadastro">

            <h2 id="tituloCadastro">Cadastro de Cidadão</h2>

            <p>
                Crie sua conta para participar das indicações.
                O cadastro é exclusivo para maiores de 18 anos.
            </p>

            <form id="formCadastro" method="post">

                <label for="nome">Nome completo:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    autocomplete="name"
                    maxlength="100"
                    required
                >

                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="telefone">Telefone (opcional):</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    autocomplete="tel"
                    placeholder="(41) 99999-9999"
                >

                <label for="data_nascimento">
                    Data de nascimento:
                </label>
                <input
                    type="date"
                    id="data_nascimento"
                    name="data_nascimento"
                    required
                >

                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    inputmode="numeric"
                    maxlength="11"
                    placeholder="Somente números exemplo '00000000000'"
                    pattern="[0-9]{11}"
                    required
                >

                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    autocomplete="new-password"
                    minlength="1"
                    required
                >

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <p id="mensagem" role="status"></p>

            <p>
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </section>
    </main>

    <footer>
        <p>Vox Populis - Plataforma de participação cidadã.</p>
    </footer>

    <script src="../js/scriptCabecalho.js"></script>
    <script src="../js/scriptCadastro.js"></script>

</body>
</html>
