<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Partido | Vox Populis</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-area="admin">

    <header>
        <h1>Vox Populis</h1>
        <p>Plataforma de participação cidadã</p>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="vereadores.html">Vereadores</a>
        </nav>
    </header>

    <main>
        <section aria-labelledby="tituloCadastroPartido">

            <h2 id="tituloCadastroPartido">
                Cadastrar Partido Político
            </h2>

            <p>
                Preencha as informações abaixo para cadastrar
                um partido político na plataforma.
            </p>

            <form id="formPartido" method="post">

                <label for="nomePartido">
                    Nome do partido:
                </label>
                <input
                    type="text"
                    id="nomePartido"
                    name="nome"
                    placeholder="Ex.: Partido Exemplo"
                    maxlength="100"
                    required
                >

                <label for="siglaPartido">
                    Sigla do partido:
                </label>
                <input
                    type="text"
                    id="siglaPartido"
                    name="sigla"
                    placeholder="Ex.: PEX"
                    maxlength="20"
                    required
                >

                <label for="numeroPartido">
                    Número do partido:
                </label>
                <input
                    type="number"
                    id="numeroPartido"
                    name="numero"
                    min="10"
                    max="99"
                    step="1"
                    placeholder="Ex.: 25"
                    required
                >

                <button type="submit">
                    Cadastrar partido
                </button>

            </form>

            <p id="mensagem" role="status"></p>

        </section>
    </main>

    <footer>
        <p>Vox Populis - Plataforma de participação cidadã.</p>
    </footer>

    <script src="../js/scriptCabecalho.js"></script>
    <script src="../js/scriptPartido.js"></script>

</body>
</html>
