<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Indicação | Vox Populis</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <h1>Vox Populis</h1>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="vereadores.html">Vereadores</a>
        </nav>
    </header>

    <main>
        <section aria-labelledby="tituloIndicacao">
            <h2 id="tituloIndicacao">Nova Indicação</h2>

            <p>Descreva sua proposta de melhoria para a comunidade.</p>

            <a href="index.html">Voltar para as indicações</a>

            <form id="formIndicacao" method="post" enctype="multipart/form-data">

                <fieldset>
                    <legend>Informações da indicação</legend>

                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" name="titulo" maxlength="100" required>

                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao" maxlength="1000" required></textarea>

                    <label for="vereador">Encaminhar para o vereador (opcional):</label>
                    <select id="vereador" name="id_vereador">
                        <option value="">Nenhum vereador específico</option>
                    </select>

                </fieldset>

                <fieldset>
                    <legend>Localização</legend>

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" maxlength="9" inputmode="numeric" placeholder="00000-000"
                        required>

                    <label for="logradouro">Rua:</label>
                    <input type="text" id="logradouro" name="logradouro" maxlenght="150">

                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero" maxlenght="50" placeholder="Ex.: 150 ou S/N" required>

                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" maxlenght="100" required>

                    <label for="municipio">Município:</label>
                    <input type="text" id="municipio" maxlenght="100" name="municipio" required>

                    <label for="estado">Estado (UF):</label>
                    <input type="text" id="estado" name="estado" maxlength="2" minlength="2" placeholder="PR" required>

                    <label for="complemento">Complemento (opcional):</label>
                    <input type="text" id="complemento" name="complemento" maxlength="100">
                </fieldset>

                <fieldset>
                    <legend>Anexos</legend>

                    <label for="fotoOuAnexo">
                        Foto ou documento (opcional):
                    </label>

                    <input type="file" id="fotoOuAnexo" name="foto_ou_anexo"
                        accept="image/jpeg,image/png,image/webp,.pdf">

                    <p>Formatos aceitos: JPG, PNG, WEBP e PDF.</p>
                </fieldset>

                <button type="submit">Enviar indicação</button>
            </form>

            <p id="mensagem" role="status"></p>
        </section>
    </main>

    <footer>
        <p>Vox Populis - Plataforma de participação cidadã.</p>
    </footer>

    <script src="../js/scriptCadastroIndicacao.js"></script>
</body>

</html>
