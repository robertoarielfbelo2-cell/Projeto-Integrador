<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vox Populis</title>
</head>
<body>

    <h1>Vox Populis</h1>
    <p>Plataforma de participação cidadã</p>

    <nav>
        <a href="home.html">Início</a> |
        <a href="feedIndicacao.html">Indicações</a> |
        <a href="vereadores.html">Vereadores</a>
    </nav>

    <hr>

    <h2>Entre na sua conta</h2>

    <p>Informe seu e-mail e sua senha para acessar sua conta.</p>

    <form id="formLogin" method="post">

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email"
               autocomplete="username" required>

        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha"
               autocomplete="current-password" required>

        <br><br>

        <button type="submit">Entrar</button>

    </form>

    <p id="mensagem" role="status"></p>

    <h2>Não tem uma conta?</h2>

    <p>Crie sua conta para participar.</p>

    <a href="index.html">Criar uma conta</a>

     <hr>


    <script src="../../backend/js/scriptLogin.js"></script>

</body>
</html>
